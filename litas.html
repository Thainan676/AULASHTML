<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listas</title>
</head>
<body>
    <h1>trabalho com listas</h1>
    <h2>listas ordenada</h2>
    <ol>
   <li>acordar</li>
   <li>tomar café</li>
   <li>escovar os dentes</li>
   <li>trabalho</li>
   <li>durmo</li>

    </ol>
    <h1>lista não ordenadas</h1>

    <ul>
    <li>pão</li>
    <li>arroz</li>
    <li>feijão</li>
    <li>tomate</li>

    </ul>

    <h1>lita de definições</h1>

     <dl>

        <dt>html</dt>
        <dd>html</dd>
        
     </dl>
    
</body>
</html>
